name = "resume-chat"
main = "worker/index.ts"
compatibility_date = "2024-11-01"

# The apex (hagestedt.com) is DNS-only in Cloudflare and served by GitHub Pages,
# so a Worker route on it wouldn't fire. Instead the Worker gets its own
# Cloudflare-managed custom domain: `wrangler deploy` auto-creates a PROXIED DNS
# record for api.hagestedt.com pointing at the Worker, leaving the apex untouched.
# The site calls it via CHAT_ENDPOINT in src/lib/claude.ts; CORS is handled in the
# Worker. (Prefer no subdomain? Delete this block and use the *.workers.dev URL.)
routes = [
  { pattern = "api.hagestedt.com", custom_domain = true }
]

# Per-IP rate limit (Workers rate limiting binding): 20 requests / 60s per client
# IP, keyed by CF-Connecting-IP in worker/index.ts. Protects the billable Anthropic
# key from abuse. namespace_id is an arbitrary unique positive integer (as a string);
# period must be 10 or 60.
[[ratelimits]]
name = "CHAT_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# ANTHROPIC_API_KEY is a SECRET — never put it in this file.
#   Set it with:  npm run worker:secret   (= wrangler secret put ANTHROPIC_API_KEY)
#   Or in the dashboard: Workers & Pages > resume-chat > Settings > Variables and Secrets.
